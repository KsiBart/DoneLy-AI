<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="DoneLy AI — marketing design kit">
  <defs>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a3c"/>
      <stop offset="0.42" stop-color="#f2732e"/>
      <stop offset="0.72" stop-color="#d24d9e"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f56"/>
      <stop offset="1" stop-color="#ff8c4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#ff7a3c" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ff5a46" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0f1117" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0f1117" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" rx="24" fill="#0f1117"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow2)"/>

  <!-- logo: circle-check + sparkle -->
  <g transform="translate(96,150)">
    <circle cx="30" cy="30" r="24" fill="none" stroke="#f2732e" stroke-width="5.5"/>
    <path d="M19 31l8 8L44 22" fill="none" stroke="#f2732e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52 2l2.1 6.6L61 11l-6.6 2.1L52 20l-2.1-6.6L43 11l6.6-2.1z" fill="#f2732e" opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <text x="176" y="205" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#f3eff7">Done</tspan><tspan fill="#f2732e">Ly</tspan><tspan fill="url(#ai)"> AI</tspan>
  </text>

  <!-- tagline -->
  <text x="178" y="258" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#cfc8da">Opisz problem — AI znajdzie fachowca.</text>
  <text x="178" y="296" font-family="'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="500" fill="#a89fb8">Polski marketplace usług lokalnych · płać po usłudze, z legalnym rachunkiem.</text>

  <!-- kit badge -->
  <g transform="translate(178,326)">
    <rect width="360" height="42" rx="21" fill="url(#cta)"/>
    <text x="180" y="28" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="800" fill="#ffffff">Marketing design kit · claude.ai/design</text>
  </g>

  <!-- decorative price pins (map motif) -->
  <g font-family="'Segoe UI',system-ui,sans-serif" font-weight="800">
    <g transform="translate(980,120)">
      <rect width="92" height="40" rx="14" fill="url(#cta)"/>
      <text x="46" y="26" text-anchor="middle" font-size="16" fill="#fff">120 zł</text>
    </g>
    <g transform="translate(1092,196)">
      <rect width="92" height="40" rx="14" fill="#1e1a26" stroke="#ff8c4d" stroke-width="2"/>
      <text x="46" y="26" text-anchor="middle" font-size="16" fill="#ff8c4d">150 zł</text>
    </g>
    <g transform="translate(972,262)">
      <rect width="100" height="40" rx="14" fill="#1e1a26" stroke="#ff8c4d" stroke-width="2"/>
      <text x="50" y="26" text-anchor="middle" font-size="16" fill="#ff8c4d">35 zł/h</text>
    </g>
    <circle cx="1044" cy="196" r="9" fill="#2a78d6" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
